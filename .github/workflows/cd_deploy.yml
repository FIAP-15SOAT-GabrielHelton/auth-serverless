name: CD Deploy (Lambdas & API Gateway)

# Disparo manual — as credenciais AWS Academy são passadas como inputs porque
# tokens de sessão expiram em ~4h e não podem ser armazenados como secrets fixos.
#
# Pré-requisito: o repositório api precisa ter sido implantado antes (publica
# rails_api_base_url no SSM que este workflow lê).
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (AWS Academy)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key (AWS Academy)'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (AWS Academy)'
        required: true
        type: string

concurrency:
  group: oficina-mecanica-auth-serverless
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Lambdas & Provision API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Mask Sensitive Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"
          echo "::add-mask::${{ secrets.JWT_SECRET }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bundla cada handler (esbuild) e empacota em build/*.zip para o Terraform.
      - name: Build Lambda Bundles
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Bootstrap S3 Backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$TF_BUCKET" 2>/dev/null; then
            echo "Bucket $TF_BUCKET já existe. Reutilizando..."
          else
            echo "Criando bucket $TF_BUCKET..."
            aws s3api create-bucket --bucket "$TF_BUCKET" --region us-east-1
          fi

          echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Provisiona as Lambdas e o API Gateway, lendo a URL pública da API Rails
      # do SSM (publicada pelo repositório api).
      - name: Terraform Provisioning
        id: terraform
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          cd infra/
          terraform init \
            -backend-config="bucket=$TF_BUCKET" \
            -backend-config="key=oficina-mecanica/auth-serverless.tfstate" \
            -backend-config="region=us-east-1"

          terraform apply -auto-approve

          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"

      - name: Print API Gateway URL
        run: echo "API Gateway URL -> ${{ steps.terraform.outputs.api_gateway_url }}"
