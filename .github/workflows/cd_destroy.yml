name: CD Destroy (Lambdas & API Gateway)

# Disparo manual para destruição imediata do ambiente.
# Deve rodar antes do destroy do repositório api (não há dependência inversa,
# mas mantém a ordem simétrica de destroy do projeto).
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (AWS Academy)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key (AWS Academy)'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (AWS Academy)'
        required: true
        type: string

concurrency:
  group: oficina-mecanica-auth-serverless
  cancel-in-progress: true

jobs:
  destroy:
    name: Destroy Lambdas & API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Mask Sensitive Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"
          echo "::add-mask::${{ secrets.JWT_SECRET }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # terraform destroy ainda avalia main.tf (inclui filebase64sha256 dos
      # zips) para montar o plano — os bundles precisam existir no disco.
      - name: Build Lambda Bundles
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: us-east-1

      - name: Bootstrap S3 Backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"
          echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Destroy
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          cd infra/
          terraform init \
            -backend-config="bucket=$TF_BUCKET" \
            -backend-config="key=oficina-mecanica/auth-serverless.tfstate" \
            -backend-config="region=us-east-1"

          terraform destroy -auto-approve
